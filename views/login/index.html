<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
     <script src="https://cdn.tailwindcss.com"></script>
     <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>


  <body class=" font-['Montserrat'] bg-slate-50 bg-[url('/assets/login.png')] bg-cover bg-center bg-no-repeat min-h-screen">

    <nav class="fixed top-0 right-0 left-0 bg-rose-400 h-16 z-50 shadow-md">
        <div class="max-w-7xl h-16 mx-auto flex items-center px-4 justify-between">
            
            <div class="flex items-center gap-2">
                <img src="/assets/logo.png" alt="logo" class="h-12 w-12 rounded-full bg-white object-cover">
                <span class="text-white font-bold text-xl tracking-tight">SpaGrachi</span>
            </div>

            <div class=" flex-row gap-7">
              <button >
                <a href="/" class="bg-rose-800 hover:bg-rose-900 py-2 px-4 rounded-lg text-white font-bold  w-2/4 text-center  ">Inicio</a>
              </button>
    </nav>


    
    <div class="flex pt-16 h-screen max-w-7xl mx-auto justify-center items-center px-4 ">
      
      <form
        id="form"
        class="flex pt-16 flex-col gap-4  text-lg  w-full md:w-9/12 lg:w-2/4 bg-white/25 backdrop-blur-md border border-white/30 shadow-xl rounded-xl p-8"
      >
        <div class="flex flex-col gap-2">
          <label class="font-bold  text-black" for="email-input"
            >Email <span class=" text-red-900">*</span></label
          >
          <input
            id="email-input"
            type="text"
            name="email-input"
            autocomplete="off"
            placeholder="ejemplo@gmail.com"
            class="rounded-lg p-2 bg-zinc-100 focus:outline-rose-700"
            />
        </div>
         <div class="flex flex-col gap-2">
          <label class="font-bold  text-black" for="password-input"
            >Contraseña <span class="text-red-700">*</span></label>

          <input
            id="password-input"
            type="password"
            name="password-input"
            autocomplete="off"
            placeholder="Ingresa tu contraseña"
            class="rounded-lg p-2 bg-zinc-100 focus:outline-rose-700"
          />
          <p id="error-text" class="text-sm text-red-600"></p>
        </div>
        <button
          id="form-btn"
          class="bg-rose-700 py-2 px-4 rounded-lg font-bold text-white hover:bg-rose-800 text-center transition ease-in-out disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Iniciar sesión
        </button>
      </form>
    </div>
  
    <script src="index.js"></script>

  </body>
</html>
